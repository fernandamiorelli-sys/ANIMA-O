            <path d="M 167 520 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6"/>
            <path d="M 174.5 520 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6 l 3.5 3.6 l -3.5 3.6"/>
          </g>
          <text id="s2-campo-sulco-rotulo" x="204" y="529" font-family="Figtree" font-weight="500" font-size="14.5" fill="#3c4558">Sulco:</text>
          <text id="s2-campo-sulco-valor" x="204" y="551" font-family="Figtree" font-weight="800" font-size="20.5" letter-spacing="-0.4" fill="#121a38">8,2 mm</text>
          <path d="M 356.5 531 L 362 536.5 L 356.5 542" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g id="s2-campo-pressao">
          <rect x="132.5" y="573" width="245" height="60" rx="12" fill="#ffffff" stroke="#e0e5ec" stroke-width="1.2"/>
          <g id="s2-icone-pressao" fill="none" stroke="#1677e5" stroke-linecap="round">
            <circle cx="165" cy="603" r="14.2" stroke-width="2.6"/>
            <path d="M 165 592.6 V 595 M 154.6 603 H 157 M 175.4 603 H 173 M 157.6 595.6 l 1.7 1.7 M 172.4 595.6 l -1.7 1.7" stroke-width="2"/>
            <path d="M 165 603 L 171 597" stroke-width="2.6"/>
          </g>
          <circle cx="165" cy="603" r="2.6" fill="#1677e5"/>
