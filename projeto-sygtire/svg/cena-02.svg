<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cena 02 — Aferição · 2.55 s → 5.90 s (frames 153 → 354 a 60 fps)
  Referência: assets/referencias/cena-02-referencia.webp

  Camada transparente sobre o fundo fixo, desenhada no estado final da composição
  (animações em animations/cena-02.js). Todo o conteúdo fica dentro de #scene-02-afericao.

  O celular é desenhado nas coordenadas medidas na referência e posicionado pelo grupo
  #s2-celular-layout (escala 0,96, topo em y = 345). Na referência o logo iSat aparece por
  cima do celular; como o logo faz parte da fotografia e não pode ser coberto nem
  modificado, o aparelho termina (com esmaecimento) logo acima dele, em y ≈ 799.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <style>@import url("../assets/fonts/fonts.css");</style>
  <g id="scene-02-afericao">
    <defs>
      <linearGradient id="s2-grad-moldura" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#cdd3db"/>
        <stop offset="0.06" stop-color="#eef1f4"/>
        <stop offset="0.5" stop-color="#fbfcfd"/>
        <stop offset="0.94" stop-color="#eceff3"/>
        <stop offset="1" stop-color="#c8ced7"/>
      </linearGradient>
      <linearGradient id="s2-grad-botao" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2275ea"/>
        <stop offset="1" stop-color="#0a5fe8"/>
      </linearGradient>
      <!-- Esmaecimento da parte inferior do aparelho (coordenadas internas do celular) -->
      <linearGradient id="s2-grad-mascara" gradientUnits="userSpaceOnUse" x1="0" y1="809" x2="0" y2="820.5">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#000000"/>
      </linearGradient>
      <mask id="s2-mascara-aparelho" maskUnits="userSpaceOnUse" x="60" y="300" width="380" height="600">
        <rect x="60" y="300" width="380" height="600" fill="url(#s2-grad-mascara)"/>
      </mask>
      <filter id="s2-sombra-aparelho" x="-20%" y="-10%" width="140%" height="125%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1c3462" flood-opacity="0.12"/>
      </filter>
      <filter id="s2-sombra-botao" x="-10%" y="-30%" width="120%" height="180%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b5fe6" flood-opacity="0.25"/>
      </filter>
    </defs>

    <!-- Título -->
    <g id="s2-titulo" font-family="Poppins" font-weight="800" font-size="69.5">
      <text id="s2-titulo-linha-1" x="70" y="196" letter-spacing="-1.4" fill="#022c7f">SULCO,</text>
      <text id="s2-titulo-linha-2" x="71" y="258" letter-spacing="-1.2" fill="#022c7f">PRESSÃO E KM.</text>
      <text id="s2-titulo-linha-3" x="70" y="319" letter-spacing="0" fill="#0465ef">PNEU A PNEU.</text>
    </g>

    <!-- Interface: smartphone -->
    <g id="s2-celular">
      <g id="s2-celular-layout" transform="translate(247.5 345) scale(0.96) translate(-247.5 -347.5)">

        <!-- Moldura e tela (esmaecem na base) -->
        <g id="s2-moldura" mask="url(#s2-mascara-aparelho)">
          <g filter="url(#s2-sombra-aparelho)">
            <rect x="100" y="347.5" width="295" height="540" rx="46" fill="url(#s2-grad-moldura)" stroke="#bcc3cc" stroke-width="1.2"/>
          </g>
          <rect x="98" y="452" width="3" height="30" rx="1.5" fill="#c3c9d1"/>
          <rect x="98" y="492" width="3" height="30" rx="1.5" fill="#c3c9d1"/>
          <rect x="394" y="470" width="3" height="52" rx="1.5" fill="#c3c9d1"/>
          <rect id="s2-tela" x="107.5" y="355" width="280" height="525" rx="39" fill="#ffffff" stroke="#e2e6eb" stroke-width="1"/>
        </g>

        <!-- Barra de status do sistema -->
        <g id="s2-barra-status">
