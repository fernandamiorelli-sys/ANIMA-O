          <g id="s2-icone-hodometro" fill="#1677e5">
            <path d="M 149.5 688 L 159.6 654 L 163.6 654 L 157.8 688 Z"/>
            <path d="M 180.5 688 L 170.4 654 L 166.4 654 L 172.2 688 Z"/>
            <rect x="163.8" y="657" width="2.4" height="7" rx="0.8"/>
