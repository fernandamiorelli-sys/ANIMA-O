            <ellipse cx="171.4" cy="468.8" rx="6.6" ry="11.6" stroke-width="2.6"/>
            <path d="M 159.5 452.8 Q 151.5 468.8 159.5 484.8" stroke-width="2.4"/>
            <path d="M 153.4 458.5 l 3.6 1.6 M 151.6 464.5 l 3.8 1 M 151.4 470.8 l 3.8 -0.2 M 152.6 477 l 3.6 -1.2 M 155 482.6 l 3.4 -2" stroke-width="1.8"/>
