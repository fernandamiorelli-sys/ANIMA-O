<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cena 05 — Custo por quilômetro · 11.05 s → 14.10 s (frames 663 → 846 a 60 fps)
  Referência: assets/referencias/cena-05-referencia.webp

  Camada transparente sobre o fundo fixo, desenhada no estado final da composição
  (animações em animations/cena-05.js). Todo o conteúdo fica dentro de #scene-05-cpk.
  O gráfico usa as posições medidas na referência (pontos, grade e rótulos); os valores e
  percentuais são exatamente os da imagem.

  Ajuste em relação à referência: o painel sobe 4 px e os cards de baixo ficam mais juntos
  (intervalo de 10 px; na referência, 17 px e 15 px), para o último card terminar em
  y = 790, antes do logo iSat da fotografia (y = 801). Na referência o logo foi desenhado mais abaixo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <style>@import url("../assets/fonts/fonts.css");</style>
  <g id="scene-05-cpk">
    <defs>
      <linearGradient id="s5-grad-area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c9e0fc" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#e9f2fe" stop-opacity="0.35"/>
      </linearGradient>
      <linearGradient id="s5-grad-verde" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#66bb6e"/>
        <stop offset="1" stop-color="#3fb747"/>
      </linearGradient>
      <linearGradient id="s5-grad-azul" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2f8ff6"/>
        <stop offset="1" stop-color="#47abfd"/>
      </linearGradient>
      <filter id="s5-sombra-card" x="-8%" y="-15%" width="116%" height="140%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1c3462" flood-opacity="0.10"/>
      </filter>
      <!-- Revelação da área sob a linha, sincronizada com o desenho da linha -->
      <clipPath id="s5-recorte-area">
        <rect id="s5-recorte-area-rect" x="142.9" y="396" width="336.6" height="110"/>
      </clipPath>
    </defs>

    <!-- Título -->
    <g id="titulo-cpk" font-family="Poppins" font-weight="800" font-size="66">
      <text id="s5-titulo-linha-1" x="70" y="199" letter-spacing="0.3" fill="#0344a0">RESULTADO</text>
      <text id="s5-titulo-linha-2" x="70" y="256" letter-spacing="0.15" fill="#0598f9">MEDIDO EM</text>
      <text id="s5-titulo-linha-3" x="71" y="311" letter-spacing="-1.45" fill="#0347a7">CUSTO POR KM</text>
      <circle id="s5-titulo-ponto" cx="566" cy="305.5" r="7.8" fill="#2bb32e"/>
    </g>

    <!-- Painel de indicadores -->
    <g id="painel-cpk">

      <!-- Indicador principal: CPK da frota -->
      <g id="card-cpk">
        <rect id="s5-card-cpk-fundo" x="70" y="335" width="456" height="216" rx="18" fill="#ffffff" filter="url(#s5-sombra-card)"/>
        <text id="texto-cpk" x="94" y="381" font-family="Figtree" font-weight="700" font-size="25" fill="#10275c">CPK da frota</text>
        <g id="s5-variacao-cpk">
          <rect x="409" y="357" width="98.5" height="34" rx="17" fill="#e6f5e9"/>
          <path d="M 429 366.5 V 380.5 M 423.5 375.5 L 429 381 L 434.5 375.5" fill="none" stroke="#2f9e3c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="452" y="380.5" font-family="Figtree" font-weight="800" font-size="18.3" letter-spacing="-0.45" fill="#2b9a38">-32%</text>
        </g>
        <g id="s5-grafico-grade" fill="none">
          <path d="M 134 415 H 505" stroke="#edf1f6" stroke-width="1"/>
          <path d="M 134 443 H 505" stroke="#edf1f6" stroke-width="1"/>
          <path d="M 134 471 H 505" stroke="#edf1f6" stroke-width="1"/>
          <path d="M 134 499 H 505" stroke="#dfe5ee" stroke-width="1"/>
          <path d="M 143 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
          <path d="M 210 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
          <path d="M 277.5 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
          <path d="M 345 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
          <path d="M 412.5 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
          <path d="M 480 415 V 499" stroke="#f0f3f7" stroke-width="1"/>
        </g>
        <g id="s5-grafico-eixo-y" font-family="Figtree" font-weight="500" font-size="14.5" fill="#a2aaba">
          <text x="96" y="420">1,20</text>
          <text x="96" y="448">0,90</text>
          <text x="96" y="476">0,60</text>
          <text x="96" y="504">0,30</text>
        </g>
        <g id="s5-grafico-eixo-x" font-family="Figtree" font-weight="500" font-size="14" fill="#a2aaba">
          <text x="143" y="530" text-anchor="middle">Jan</text>
          <text x="210" y="530" text-anchor="middle">Fev</text>
          <text x="277.5" y="530" text-anchor="middle">Mar</text>
          <text x="345" y="530" text-anchor="middle">Abr</text>
          <text x="412.5" y="530" text-anchor="middle">Mai</text>
          <text x="480" y="530" text-anchor="middle">Jun</text>
        </g>
        <path id="s5-grafico-area" d="M 142.9 413.9 L 209.8 436.6 L 277.3 453.3 L 345.3 469.2 L 412.3 482.0 L 479.5 491.5 L 479.5 499 L 142.9 499 Z" fill="url(#s5-grad-area)" clip-path="url(#s5-recorte-area)"/>
        <path id="linha-grafico" d="M 142.9 413.9 L 209.8 436.6 L 277.3 453.3 L 345.3 469.2 L 412.3 482.0 L 479.5 491.5" fill="none" stroke="#1776e1" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="s5-grafico-pontos">
          <circle id="s5-ponto-jan" cx="142.9" cy="413.9" r="6.6" fill="#1673e6"/>
          <circle id="s5-ponto-fev" cx="209.8" cy="436.6" r="6.6" fill="#1673e6"/>
          <circle id="s5-ponto-mar" cx="277.3" cy="453.3" r="6.6" fill="#1673e6"/>
          <circle id="s5-ponto-abr" cx="345.3" cy="469.2" r="6.6" fill="#1673e6"/>
          <circle id="s5-ponto-mai" cx="412.3" cy="482.0" r="6.6" fill="#1673e6"/>
        </g>
        <g id="ponto-final">
          <circle id="s5-ponto-final-halo" cx="479.5" cy="491.5" r="7" fill="#27a33a" opacity="0"/>
          <circle id="s5-ponto-final-anel" cx="479.5" cy="491.5" r="6.2" fill="#ffffff" stroke="#27a33a" stroke-width="3.2"/>
        </g>
      </g>

      <!-- Indicador secundário: índice de recapabilidade -->
      <g id="card-recapabilidade">
        <rect id="s5-card-recapabilidade-fundo" x="70" y="561" width="456" height="112" rx="18" fill="#ffffff" filter="url(#s5-sombra-card)"/>
        <text id="s5-recapabilidade-titulo" x="94" y="603.5" font-family="Figtree" font-weight="700" font-size="24" fill="#10275c">Índice de recapabilidade</text>
        <g id="s5-variacao-recapabilidade">
          <rect x="409" y="580" width="98.5" height="34" rx="17" fill="#e6f5e9"/>
          <path d="M 423 600 L 429 594 L 435 600" fill="none" stroke="#2f9e3c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="452" y="603.5" font-family="Figtree" font-weight="800" font-size="18.3" letter-spacing="-0.45" fill="#2b9a38">+18%</text>
        </g>
        <rect id="s5-recapabilidade-trilho" x="94" y="628.5" width="332" height="23" rx="11.5" fill="#e4eaf1"/>
        <g id="barra-recapabilidade">
          <rect x="94" y="628.5" width="269.5" height="23" rx="11.5" fill="url(#s5-grad-verde)"/>
        </g>
        <text id="s5-recapabilidade-valor" x="505" y="650.5" text-anchor="end" font-family="Poppins" font-weight="700" font-size="29.5" letter-spacing="-0.6" fill="#0c2356">78%</text>
      </g>

      <!-- Indicador secundário: sucateamento precoce -->
      <g id="card-sucateamento">
        <rect id="s5-card-sucateamento-fundo" x="70" y="683" width="456" height="107" rx="18" fill="#ffffff" filter="url(#s5-sombra-card)"/>
        <text id="s5-sucateamento-titulo" x="94" y="726" font-family="Figtree" font-weight="700" font-size="24" fill="#10275c">Sucateamento precoce</text>
        <g id="s5-variacao-sucateamento">
          <rect x="409" y="701" width="98.5" height="34" rx="17" fill="#e6f5e9"/>
          <path d="M 423 715 L 429 721 L 435 715" fill="none" stroke="#2f9e3c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="452" y="724.5" font-family="Figtree" font-weight="800" font-size="18.3" letter-spacing="-0.45" fill="#2b9a38">-45%</text>
        </g>
        <rect id="s5-sucateamento-trilho" x="94" y="749.5" width="332" height="21" rx="10.5" fill="#e4eaf1"/>
        <g id="barra-sucateamento">
          <rect x="94" y="749.5" width="65" height="21" rx="10.5" fill="url(#s5-grad-azul)"/>
        </g>
        <text id="s5-sucateamento-valor" x="505" y="771" text-anchor="end" font-family="Poppins" font-weight="700" font-size="29.5" letter-spacing="-0.6" fill="#0c2356">12%</text>
      </g>
    </g>
  </g>
</svg>
