          <text id="s2-campo-hodometro-valor" x="204" y="687" font-family="Figtree" font-weight="800" font-size="20.5" letter-spacing="-0.4" fill="#121a38">84.320 km</text>
          <path d="M 356.5 667 L 362 672.5 L 356.5 678" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Botão -->
        <g id="s2-botao-salvar">
          <rect id="s2-botao-fundo" x="132.5" y="714" width="245.5" height="51" rx="13" fill="url(#s2-grad-botao)" filter="url(#s2-sombra-botao)"/>
          <text id="s2-botao-texto" x="255.25" y="746" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="19.5" letter-spacing="-0.7" fill="#ffffff">Salvar aferição</text>
        </g>

        <!-- Anel de destaque do botão (invisível no estado final) -->
        <rect id="s2-botao-destaque" x="128" y="709.5" width="254.5" height="60" rx="16.5" fill="none" stroke="#3b8cf2" stroke-width="3" opacity="0"/>

        <!-- Confirmação -->
        <g id="s2-confirmacao">
          <rect id="s2-confirmacao-fundo" x="132.5" y="768.5" width="245.5" height="45.5" rx="13" fill="#e8f5ea"/>
          <circle id="s2-confirmacao-circulo" cx="205" cy="795" r="11.5" fill="#2e9a49"/>
          <path id="s2-confirmacao-check" d="M 199.6 795.4 L 203.4 799.1 L 210.6 791.8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text id="s2-confirmacao-texto" x="226" y="800" font-family="Figtree" font-weight="700" font-size="16.5" letter-spacing="-0.78" fill="#2b8a3e">Aferição salva</text>
