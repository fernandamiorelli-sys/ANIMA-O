<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cena 06 — Integração · 14.10 s → 16.95 s (frames 846 → 1017 a 60 fps)
  Referência: assets/referencias/cena-06-referencia.webp

  Camada transparente sobre o fundo fixo, desenhada no estado final da composição
  (animações em animations/cena-06.js). Todo o conteúdo fica dentro de #scene-06-integracao.

  As marcas SAGI, iSat e SygTire dentro dos cards são reconstruções vetoriais aproximadas
  (texto + formas) a partir da referência. Os logotipos da fotografia de fundo não fazem
  parte desta cena e não são tocados. Os pontos #fluxo-sagi e #fluxo-isat ficam invisíveis
  no estado final: eles só aparecem enquanto percorrem as conexões.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <style>@import url("../assets/fonts/fonts.css");</style>
  <g id="scene-06-integracao">
    <defs>
      <linearGradient id="s6-grad-barras" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#1683ee"/>
        <stop offset="1" stop-color="#45b0fb"/>
      </linearGradient>
      <linearGradient id="s6-grad-sinal" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#57b947"/>
        <stop offset="1" stop-color="#9fd86f"/>
      </linearGradient>
      <filter id="s6-sombra-card" x="-12%" y="-20%" width="124%" height="150%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1c3462" flood-opacity="0.11"/>
      </filter>
      <filter id="s6-brilho-no" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <filter id="s6-brilho-sincronizacao" x="-15%" y="-25%" width="130%" height="150%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <!-- Título -->
    <g id="titulo-integracao" font-family="Poppins" font-weight="800" font-size="76" fill="#034ec2">
      <text id="s6-titulo-linha-1" x="67" y="214" letter-spacing="0.58">INTEGRADO</text>
      <text id="s6-titulo-linha-2" x="68" y="280.5" letter-spacing="-0.23">AO SAGI E</text>
      <text id="s6-titulo-linha-3" x="68" y="348" letter-spacing="-1.51">AO iSat</text>
      <circle id="s6-titulo-ponto" cx="355.5" cy="340" r="8.3" fill="#74c546"/>
    </g>

    <!-- Conexões e fluxo (atrás dos cards) -->
    <g id="s6-conexoes" fill="none" stroke="#1b8fe5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path id="conexao-sagi" d="M 152.5 509 C 152.5 531 157 542 180 542 H 234 C 256 542 268 551 270 568 V 610"/>
      <path id="conexao-isat" d="M 422.5 509 C 422.5 531 418 542 395 542 H 306 C 284 542 272 551 270 568 V 610"/>
      <path id="s6-conexao-seta" d="M 262.5 603 L 270 611 L 277.5 603"/>
    </g>

    <!-- Card 1 — SAGI -->
    <g id="card-sagi">
      <rect id="s6-card-sagi-fundo" x="66" y="395" width="218" height="105" rx="18" fill="#ffffff" filter="url(#s6-sombra-card)"/>
      <g id="s6-card-sagi-icone">
        <rect x="86" y="419" width="54" height="54" rx="11" fill="#f5f8fc" stroke="#e5eaf1" stroke-width="1"/>
        <g fill="none" stroke="#1a73e8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="89" y="437.5" width="28" height="23" rx="2.5"/>
          <path d="M 117 445 H 126.5 L 134 453.5 V 460.5 H 117"/>
          <path d="M 121 449 H 126 L 129.5 453.5"/>
          <circle cx="98" cy="463.5" r="4.6" fill="#ffffff"/>
          <circle cx="126.5" cy="463.5" r="4.6" fill="#ffffff"/>
        </g>
      </g>
      <g id="s6-card-sagi-textos">
        <text x="154" y="448" font-family="Poppins" font-weight="800" font-size="27.5" letter-spacing="-0.2" fill="#09164a">SAGI</text>
        <text x="154" y="473" font-family="Figtree" font-weight="500" font-size="14.6" fill="#5f6573">Veículos e placas</text>
      </g>
    </g>

    <!-- Card 2 — iSat -->
    <g id="card-isat">
      <rect id="s6-card-isat-fundo" x="325" y="395" width="192.5" height="105" rx="18" fill="#ffffff" filter="url(#s6-sombra-card)"/>
      <g id="s6-card-isat-icone">
        <rect x="350" y="419" width="49" height="53.5" rx="11" fill="#f5f8fc" stroke="#e5eaf1" stroke-width="1"/>
        <g fill="url(#s6-grad-barras)">
          <rect x="358" y="450" width="5.4" height="12.5" rx="1.2"/>
          <rect x="366.6" y="441" width="5.4" height="21.5" rx="1.2"/>
          <rect x="375.2" y="430" width="5.4" height="32.5" rx="1.2"/>
          <rect x="383.8" y="420" width="5.4" height="42.5" rx="1.2"/>
        </g>
      </g>
      <g id="s6-card-isat-textos">
        <g transform="translate(415 452) skewX(-11)">
          <text x="0" y="0" font-family="Poppins" font-weight="800" font-size="43" letter-spacing="-2.4"><tspan fill="#0f50b4">iS</tspan><tspan fill="#1fa2f3">at</tspan></text>
        </g>
        <text x="415.5" y="473" font-family="Figtree" font-weight="500" font-size="14.3" fill="#5f6573">Hodômetro</text>
      </g>
    </g>

    <!-- Card 3 — SygTire -->
    <g id="card-sygtire">
      <rect id="s6-card-sygtire-fundo" x="137.5" y="615" width="276.5" height="132.5" rx="20" fill="#ffffff" stroke="#e3e8ef" stroke-width="1.2" filter="url(#s6-sombra-card)"/>
      <g id="s6-sincronizacao">
        <rect x="137.5" y="615" width="276.5" height="132.5" rx="20" fill="none" stroke="#7fe07a" stroke-width="7" opacity="0.55" filter="url(#s6-brilho-sincronizacao)"/>
        <rect x="137.5" y="615" width="276.5" height="132.5" rx="20" fill="none" stroke="#9be596" stroke-width="3"/>
      </g>
      <g id="s6-card-sygtire-marca">
        <g fill="none" stroke-linecap="round" transform="translate(6 681) skewX(-13) translate(0 -681)">
            <path d="M 200.8 640.4 A 23 41.5 0 0 0 200.8 721.6" stroke="#0b45d4" stroke-width="6.6"/>
            <path d="M 210.4 640.4 A 23 41.5 0 0 0 210.4 721.6" stroke="#1259e0" stroke-width="5.8"/>
            <path d="M 220.0 640.4 A 23 41.5 0 0 0 220.0 721.6" stroke="#1e73ea" stroke-width="5.1"/>
            <path d="M 229.6 640.4 A 23 41.5 0 0 0 229.6 721.6" stroke="#2f8ff3" stroke-width="4.5"/>
        </g>
        <g fill="url(#s6-grad-sinal)">
          <rect x="264.5" y="664" width="3" height="4" rx="0.8"/>
          <rect x="269.5" y="661" width="3" height="7" rx="0.8"/>
          <rect x="274.5" y="658" width="3" height="10" rx="0.8"/>
          <rect x="279.5" y="655.5" width="3" height="12.5" rx="0.8"/>
        </g>
        <text x="239" y="688" font-family="Poppins" font-weight="700" font-size="35.5" fill="#0a1950">SygTire</text>
      </g>
      <text id="s6-card-sygtire-texto" x="242" y="720" font-family="Figtree" font-weight="500" font-size="16.4" fill="#3c4354">Sempre atualizado</text>
    </g>

    <!-- Nós verdes das conexões -->
    <g id="s6-no-sagi">
        <circle cx="152.5" cy="500.5" r="11" fill="#5fe35f" opacity="0.35" filter="url(#s6-brilho-no)"/>
        <circle cx="152.5" cy="500.5" r="8.6" fill="#ffffff"/>
        <circle cx="152.5" cy="500.5" r="6.2" fill="#3fcf4a"/>
      </g>
    <g id="s6-no-isat">
        <circle cx="422.5" cy="500.5" r="11" fill="#5fe35f" opacity="0.35" filter="url(#s6-brilho-no)"/>
        <circle cx="422.5" cy="500.5" r="8.6" fill="#ffffff"/>
        <circle cx="422.5" cy="500.5" r="6.2" fill="#3fcf4a"/>
      </g>
    <g id="s6-no-juncao">
        <circle cx="270" cy="574" r="11" fill="#5fe35f" opacity="0.35" filter="url(#s6-brilho-no)"/>
        <circle cx="270" cy="574" r="8.6" fill="#ffffff"/>
        <circle cx="270" cy="574" r="6.2" fill="#3fcf4a"/>
      </g>

    <!-- Pontos de fluxo (visíveis só durante o percurso) -->
    <circle id="fluxo-sagi" cx="152.5" cy="509" r="5.4" fill="#3fcf4a" stroke="#ffffff" stroke-width="2" opacity="0"/>
    <circle id="fluxo-isat" cx="422.5" cy="509" r="5.4" fill="#3fcf4a" stroke="#ffffff" stroke-width="2" opacity="0"/>
  </g>
</svg>
