          <rect x="214" y="367" width="84" height="20" rx="10" fill="#0d0f14"/>
          <circle cx="287" cy="377" r="3.4" fill="#1d2534"/>
          <g fill="#11161f">
            <rect x="321.5" y="382.5" width="2.6" height="4" rx="0.8"/>
            <rect x="325.5" y="380.5" width="2.6" height="6" rx="0.8"/>
            <rect x="329.5" y="378.5" width="2.6" height="8" rx="0.8"/>
            <rect x="333.5" y="376.5" width="2.6" height="10" rx="0.8"/>
