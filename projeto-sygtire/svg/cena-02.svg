          <path d="M 149.5 413.5 H 137 M 142.6 407.8 L 137 413.5 L 142.6 419.2" fill="none" stroke="#111a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="167" y="422" font-family="Figtree" font-weight="800" font-size="20" letter-spacing="-0.8" fill="#111a3a">Nova aferição</text>
        </g>

