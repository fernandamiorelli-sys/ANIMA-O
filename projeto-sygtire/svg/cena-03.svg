<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cena 03 — Alertas · 5.90 s → 8.90 s (frames 354 → 534 a 60 fps)
  Referência: assets/referencias/cena-03-referencia.webp

  Camada transparente sobre o fundo fixo, desenhada no estado final da composição
  (animações em animations/cena-03.js). Todo o conteúdo fica dentro de #scene-03-alertas.

  Ajuste em relação à referência: o painel começa 3 px acima e as linhas de alerta têm
  10 px de intervalo (14 px na referência), para o painel terminar em y = 787, antes do
