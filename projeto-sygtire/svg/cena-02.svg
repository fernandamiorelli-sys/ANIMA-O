            <path d="M 339.5 380.2 Q 345.3 375 351.1 380.2"/>
            <path d="M 341.9 382.6 Q 345.3 379.6 348.7 382.6"/>
          </g>
          <circle cx="345.3" cy="385.4" r="1.4" fill="#11161f"/>
          <rect x="355.5" y="379.2" width="15" height="7.8" rx="2.2" fill="none" stroke="#11161f" stroke-width="1.2" stroke-opacity="0.45"/>
          <rect x="357" y="380.7" width="12" height="4.8" rx="1.2" fill="#11161f"/>
          <rect x="371.4" y="381.6" width="1.6" height="3" rx="0.8" fill="#11161f" fill-opacity="0.45"/>
        </g>

