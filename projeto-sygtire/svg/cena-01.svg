<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cena 01 — Abertura · 0.00 s → 2.55 s (frames 0 → 153 a 60 fps)
  Referência: assets/referencias/cena-01-referencia.webp

  Camada transparente sobre o fundo fixo, desenhada no estado final da composição
  (as animações de entrada e saída ficam em animations/cena-01.js).
  Todo o conteúdo (inclusive <defs>) fica DENTRO do grupo #scene-01-abertura; é ele que o
  master.js importa. O <style> abaixo só carrega as fontes ao abrir este arquivo sozinho.

  Ajuste em relação à referência: os três cards têm 98 px de altura e 13 px de intervalo
  (na referência, 103 px e 18 px). Na referência o logo iSat foi desenhado mais abaixo; na
  fotografia original ele começa em y = 801, e o terceiro card precisa terminar antes disso.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <style>@import url("../assets/fonts/fonts.css");</style>
  <g id="scene-01-abertura">
    <defs>
      <linearGradient id="s1-grad-tag" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4a8d20"/>
        <stop offset="1" stop-color="#8dbf2c"/>
      </linearGradient>
      <linearGradient id="s1-grad-sublinhado" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3f8a2e"/>
        <stop offset="0.55" stop-color="#7fb04f" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#b5d08a" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="s1-grad-barras" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#0a76d0"/>
        <stop offset="1" stop-color="#2ea2f2"/>
      </linearGradient>
      <filter id="s1-sombra-card" x="-8%" y="-20%" width="116%" height="150%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="4" stdDeviation="5.5" flood-color="#1c3a6c" flood-opacity="0.14"/>
      </filter>
    </defs>

    <!-- Linhas decorativas finas na margem esquerda -->
    <g id="s1-linhas-decorativas" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path id="s1-linha-a" stroke="#86c8ef" stroke-opacity="0.75" d="M -2 280 C 28 280 40 296 40 326 L 40 446 C 40 462 46 472 56 484 L 62 491"/>
      <path id="s1-linha-b" stroke="#86c8ef" stroke-opacity="0.6" d="M -2 300 C 18 300 28 312 28 334 L 28 452 C 28 470 36 482 46 494 L 52 501 L 52 690 C 52 708 46 720 38 732 L 30 744 L 30 941"/>
      <path id="s1-linha-c" stroke="#a6d58a" stroke-opacity="0.65" d="M -2 318 C 10 318 16 328 16 346 L 16 470 C 16 486 22 498 32 510 L 40 520 L 40 700 C 40 716 34 728 26 740 L 18 752 L 18 941"/>
      <path id="s1-linha-d" stroke="#86c8ef" stroke-opacity="0.45" d="M 6 560 L 6 941"/>
      <path id="s1-linha-e" stroke="#86c8ef" stroke-opacity="0.6" d="M 190 790 L 236 836 C 244 844 248 854 248 866 L 248 941"/>
      <path id="s1-linha-f" stroke="#86c8ef" stroke-opacity="0.5" d="M 207 790 L 256 839 C 264 847 268 857 268 869 L 268 941"/>
      <path id="s1-linha-g" stroke="#a6d58a" stroke-opacity="0.6" d="M 296 818 L 328 850 C 336 858 340 868 340 880 L 340 941"/>
    </g>

    <!-- Título -->
    <g id="s1-titulo">
      <g id="s1-tag-lancamento">
        <rect id="s1-tag-fundo" x="69" y="142" width="253" height="48" rx="24" fill="url(#s1-grad-tag)"/>
        <text id="s1-tag-texto" x="92" y="176.5" font-family="Poppins" font-weight="600" font-size="26.5" letter-spacing="0.35" fill="#ffffff">LANÇAMENTO</text>
      </g>
      <g id="s1-titulo-texto" font-family="Poppins" font-weight="800" font-size="55">
        <text id="s1-titulo-linha-1" x="69" y="255" letter-spacing="-0.86" fill="#063b8e">PNEU DESCARTADO</text>
        <text id="s1-titulo-linha-2" x="70" y="308" letter-spacing="0" fill="#0796eb">CEDO É DINHEIRO</text>
        <text id="s1-titulo-linha-3" x="71" y="360" letter-spacing="-1.33" fill="#063b8e">QUE FICOU NA</text>
        <text id="s1-titulo-linha-4" x="70" y="412" letter-spacing="0.55" fill="#063b8e">ESTRADA</text>
      </g>
      <rect id="s1-titulo-sublinhado" x="69" y="434" width="139" height="4.5" rx="2.25" fill="url(#s1-grad-sublinhado)"/>
    </g>

    <!-- Card 1 — Decisão no achismo -->
    <g id="s1-card-1">
      <rect id="s1-card-1-fundo" x="68" y="459" width="411" height="98" rx="14" fill="#ffffff" filter="url(#s1-sombra-card)"/>
      <g id="s1-card-1-icone">
        <g transform="translate(88 475)">
          <rect width="66" height="66" rx="13" fill="#d6edfd"/>
          <rect x="15" y="37" width="9.5" height="19" rx="2" fill="url(#s1-grad-barras)"/>
          <rect x="28" y="24.5" width="9.5" height="31.5" rx="2" fill="url(#s1-grad-barras)"/>
          <rect x="41" y="13" width="9.5" height="43" rx="2" fill="url(#s1-grad-barras)"/>
        </g>
      </g>
      <rect id="s1-card-1-divisor" x="178" y="478" width="1.6" height="60" rx="0.8" fill="#cdd6e2"/>
      <text id="s1-card-1-titulo" x="202" y="492" font-family="Poppins" font-weight="800" font-size="19" fill="#0a3a8a">DECISÃO NO ACHISMO</text>
      <text id="s1-card-1-descricao" font-family="Figtree" font-weight="500" font-size="17.5" fill="#575f6e">
        <tspan x="203" y="515">Sem dados confiáveis, a troca</tspan>
        <tspan x="203" y="536.5">acontece antes da hora.</tspan>
      </text>
    </g>

    <!-- Card 2 — Planilha e papel -->
    <g id="s1-card-2">
      <rect id="s1-card-2-fundo" x="68" y="570" width="411" height="98" rx="14" fill="#ffffff" filter="url(#s1-sombra-card)"/>
      <g id="s1-card-2-icone">
        <g transform="translate(88 586)">
          <rect width="66" height="66" rx="13" fill="#e5f2df"/>
          <g fill="none" stroke="#3f9a30" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 20 13.5 H 39.5 L 50.5 24.5 V 52.5 Q 50.5 55 48 55 H 20 Q 17.5 55 17.5 52.5 V 16 Q 17.5 13.5 20 13.5 Z"/>
            <path d="M 39.5 13.5 V 22 Q 39.5 24.5 42 24.5 H 50.5"/>
            <path d="M 24.5 32.5 H 43.5 M 24.5 39.5 H 43.5 M 24.5 46.5 H 37"/>
          </g>
        </g>
      </g>
      <rect id="s1-card-2-divisor" x="178" y="589" width="1.6" height="60" rx="0.8" fill="#cdd6e2"/>
      <text id="s1-card-2-titulo" x="202" y="603" font-family="Poppins" font-weight="800" font-size="19" fill="#0a3a8a">PLANILHA E PAPEL</text>
      <text id="s1-card-2-descricao" font-family="Figtree" font-weight="500" font-size="17.5" fill="#575f6e">
        <tspan x="203" y="626">Controles manuais dificultam</tspan>
        <tspan x="203" y="647.5">a gestão e aumentam falhas.</tspan>
      </text>
    </g>

    <!-- Card 3 — Descarte antecipado -->
    <g id="s1-card-3">
      <rect id="s1-card-3-fundo" x="68" y="681" width="411" height="98" rx="14" fill="#ffffff" filter="url(#s1-sombra-card)"/>
      <g id="s1-card-3-icone">
        <g transform="translate(88 697)">
          <rect width="66" height="66" rx="13" fill="#d6edfd"/>
          <g fill="none" stroke="#1561c6" stroke-linecap="round">
            <ellipse cx="33" cy="33" rx="20" ry="22.5" stroke-width="4.6"/>
            <ellipse cx="38.5" cy="33" rx="8.6" ry="14.8" stroke-width="4"/>
            <path d="M 25.5 14.2 Q 15.5 33 25.5 51.8" stroke-width="3.8"/>
          </g>
        </g>
      </g>
      <rect id="s1-card-3-divisor" x="178" y="700" width="1.6" height="60" rx="0.8" fill="#cdd6e2"/>
      <text id="s1-card-3-titulo" x="202" y="714" font-family="Poppins" font-weight="800" font-size="19" fill="#0a3a8a">DESCARTE ANTECIPADO</text>
      <text id="s1-card-3-descricao" font-family="Figtree" font-weight="500" font-size="17.5" fill="#575f6e">
        <tspan x="203" y="737">Pneus com vida útil restante</tspan>
        <tspan x="203" y="758.5">acabam gerando prejuízo.</tspan>
      </text>
    </g>
  </g>
</svg>
